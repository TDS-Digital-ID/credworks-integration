[package]
name = "identity-core"
version = "0.1.0"
description = "Single conformant VC/SD-JWT core for the UNSW credential POC"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
aes-gcm = "0.10.3"
base64ct = { version = "1.8.3", features = ["alloc"] }
flate2 = "1.1.5"
getrandom = "0.4.3"
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
rcgen = { version = "=0.14.5", default-features = false, features = ["pem"] }
rustls-pki-types = "1.15.1"
rustls-webpki = { version = "0.103.14", features = ["alloc", "ring", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
time = { version = "0.3.45", features = ["parsing"] }
url = "2.5.8"
x509-parser = { version = "0.18.1", features = ["verify"] }
zeroize = "1.8.2"
