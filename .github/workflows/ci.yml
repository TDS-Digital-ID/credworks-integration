name: Standalone integration kit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine3.23
        env:
          POSTGRES_USER: education
          POSTGRES_PASSWORD: education
          POSTGRES_DB: education
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U education -d education"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARGO_BUILD_JOBS: "2"
      EDUCATION_APP_DATABASE_URL: postgres://education:education@127.0.0.1:5432/education
      EDUCATION_APP_TEST_PORT: "29270"
      PARTNER_ISSUER_DATABASE_URL: postgres://education:education@127.0.0.1:5432/issuer
      PARTNER_OTHER_ISSUER_DATABASE_URL: postgres://education:education@127.0.0.1:5432/other_issuer
      PARTNER_ISSUER_HTTP_PORT: "29230"
      PARTNER_ISSUER_CONTAINER_HTTP_PORT: "29250"
      PARTNER_SESSION_HTTP_PORT: "29200"
      PARTNER_EVIDENCE_HTTP_PORT: "29202"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.92.0
      - run: pnpm install --frozen-lockfile
      - name: Create dedicated standalone issuer ledgers
        run: |
          pnpm --filter @unsw-vc/partner-runtime exec node --input-type=module -e "import {Pool} from 'pg'; const p=new Pool({connectionString:process.env.EDUCATION_APP_DATABASE_URL}); try { await p.query('CREATE DATABASE issuer'); await p.query('CREATE DATABASE other_issuer'); } finally { await p.end(); }"
          pnpm --filter @unsw-vc/partner-runtime db:migrate
          PARTNER_ISSUER_DATABASE_URL="$PARTNER_OTHER_ISSUER_DATABASE_URL" pnpm --filter @unsw-vc/partner-runtime db:migrate
      - run: pnpm build
      - run: node apps/partner-runtime/tool/check-packaged-addon.mjs
      - run: cargo test --locked --package identity-core
      - run: pnpm check
      - name: Build revision-labelled production images
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f apps/partner-runtime/Dockerfile -t "credworks-partner:git-$GITHUB_SHA" .
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f apps/education-sign-in/Dockerfile -t "credworks-education:git-$GITHUB_SHA" .
      - name: Production container replacement and isolation
        env:
          PARTNER_REQUIRE_ALL_CHECKS: "1"
          PARTNER_CONTAINER_IMAGE: credworks-partner:git-${{ github.sha }}
          PARTNER_CONTAINER_SOURCE_REVISION: ${{ github.sha }}
        run: pnpm test:fixtures
